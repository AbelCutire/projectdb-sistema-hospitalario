services:
  db:
    build:
      context: .
      dockerfile: Docker/Dockerfile
    container_name: bd-parcial
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./backend/extension:/tmp/extension
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Docker/Dockerfile.backend
    container_name: hospital-backend
    restart: unless-stopped
    environment:
      PORT: 3000
      DATABASE_URL: "postgresql://postgres:admin@db:5432/postgres?schema=public"
      JWT_SECRET: "supersecretjwtkeyhospital2026"
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Docker/Dockerfile.frontend
    container_name: hospital-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: "http://localhost:3000"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
